name: Tests

on:
  push:
    branches:
      - main
      - 6-feat-pss-digital-signature
  pull_request:
    branches:
      - main
      - 6-feat-pss-digital-signature

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest